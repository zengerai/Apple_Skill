<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Apple-inspired Web · Split Workbench</title><link rel="stylesheet" href="../styles/apple-native.css"><style>
body{background:#f7f9fc}.demo{max-width:1280px;padding:38px 25px;margin:auto}.demo h1{font-size:28px;letter-spacing:-.5px}.split-detail{padding:21px;min-height:400px}.info-line{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--an-line);gap:12px}.info-line span:first-child{color:var(--an-text-2)}.split-list{height:100%;min-height:0}.an-split{align-items:stretch}@media(max-width:700px){.demo{padding:22px 15px}.an-split{grid-template-columns:1fr}}
</style></head><body><main class="demo"><div class="an-eyebrow">Generic layout pattern · Browser-native Web</div><h1>分栏工作区</h1><p class="an-muted">在一个上下文中快速切换对象并检查详情，示例数据与任何业务无关。</p>
<div class="an-split" style="margin-top:25px"><aside class="an-panel an-split-nav" aria-label="对象列表"><div class="an-section-heading"><div><h2>对象列表</h2><p>当前选中项</p></div></div><button class="an-split-item active" data-name="设计资料" data-owner="Ari" data-update="今天" data-desc="用于展示通用详情页的清晰层级与操作反馈。"><strong>设计资料</strong><small>最近更新 · 今天</small></button><button class="an-split-item" data-name="项目计划" data-owner="Mina" data-update="昨天" data-desc="分栏模式适合有限字段、频繁切换对象的工作。"><strong>项目计划</strong><small>最近更新 · 昨天</small></button><button class="an-split-item" data-name="组件清单" data-owner="Kai" data-update="本周" data-desc="如果详情很宽，应使用全宽页而不是挤压数据。"><strong>组件清单</strong><small>最近更新 · 本周</small></button></aside>
<section class="an-panel split-detail" aria-live="polite"><div class="an-section-heading"><div><div class="an-eyebrow">项目详情</div><h2 id="name" style="font-size:20px;margin-top:7px">设计资料</h2></div><button class="an-btn primary" id="action">示例操作</button></div><div class="info-line"><span>负责人</span><strong id="owner">Ari</strong></div><div class="info-line"><span>最近更新</span><strong id="update">今天</strong></div><p id="desc" style="color:var(--an-text-2);font-size:13px;margin-top:22px">用于展示通用详情页的清晰层级与操作反馈。</p></section></div></main><div class="an-toast" id="toast" aria-live="polite"></div>
<script>(()=>{let timer=null;document.querySelectorAll('.an-split-item').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.an-split-item').forEach(x=>x.classList.toggle('active',x===b));for(const id of ['name','owner','update','desc'])document.getElementById(id).textContent=b.dataset[id]}));document.getElementById('action').addEventListener('click',()=>{const n=document.getElementById('name').textContent,t=document.getElementById('toast');t.textContent='已对「'+n+'」执行演示操作';t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2400)})})();</script></body></html>
