name: Validate Apple Provider
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
  motion-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build React Motion example
        working-directory: examples/motion-gallery
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Browser smoke in Chromium
        run: |
          cd examples/motion-gallery
          npm run dev -- --host 127.0.0.1 > /tmp/apple-vite.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for _ in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5173',timeout=2)
                  print('Vite ready')
                  break
              except Exception: time.sleep(.3)
          else: raise RuntimeError('Vite failed to start')
          PY
          python ../../scripts/browser_smoke.py --url http://127.0.0.1:5173
